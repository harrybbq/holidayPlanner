# Temporary: see what brouter.de's rail profile and Nominatim's station search give. Removed after.
name: BRouter probe
on:
  push:
    branches: [claude/affectionate-cray-9y8fuf]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HolidayPlanner/0.1 (route probe)"
          rail() {
            printf "%-34s " "$1"
            code=$(curl -s -m 90 -A "$UA" -o body.txt -w "%{http_code}" "https://brouter.de/brouter?lonlats=$2&profile=rail&alternativeidx=0&format=geojson")
            if [ "$code" = 200 ]; then echo "$(grep -o '"track-length": "[0-9]*"' body.txt) first $(jq -c '.features[0].geometry.coordinates[0][0:2]' body.txt) last $(jq -c '.features[0].geometry.coordinates[-1][0:2]' body.txt)"; else echo "HTTP $code $(head -c 120 body.txt)"; fi
            sleep 1.2
          }
          named() { # name lat lng
            echo "--- \"$1 station\""
            b="$(echo "$3 - 0.3" | bc),$(echo "$2 - 0.3" | bc),$(echo "$3 + 0.3" | bc),$(echo "$2 + 0.3" | bc)"
            curl -s -m 30 -A "$UA" "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=4&accept-language=en&bounded=1&viewbox=$b&q=$(echo "$1 station" | sed 's/ /+/g')" \
              | jq -r '.[] | "  \(.name) | \(.category)=\(.type) | imp \(.importance) | \(.lon),\(.lat)"'
            sleep 1.2
          }
          named Tokyo 35.676 139.65
          named Kyoto 35.012 135.768
          named "Mt Fuji" 35.361 138.727
          named Milan 45.464 9.19
          named Prague 50.076 14.438
          named Venice 45.441 12.316
          named Dubrovnik 42.65 18.094
          named Oslo 59.914 10.752
          rail "Kyoto Stn -> Kawaguchiko" "135.7588,34.9858|138.769,35.498"
          rail "Kyoto Stn -> Mt Fuji summit" "135.7588,34.9858|138.727,35.361"
          rail "Split -> Dubrovnik" "16.44,43.508|18.094,42.65"
          rail "Rome -> Venice" "12.496,41.903|12.316,45.441"
